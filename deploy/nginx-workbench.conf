# 科研工作台公网入口：basic auth + 反代到本机 8900
# 放到 /etc/nginx/conf.d/workbench.conf
# 密码文件: printf "user:$(openssl passwd -apr1 '密码')" > /etc/nginx/workbench.htpasswd
server {
    listen 28488;
    server_name _;

    auth_basic "Research Workbench";
    auth_basic_user_file /etc/nginx/workbench.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8900;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
